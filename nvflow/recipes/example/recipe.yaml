recipe: example
description: "Example recipe demonstrating nvflow capabilities"

# Workflow execution order (logical sequence)
# Workflows are displayed and documented in this order.
# Workflows not listed here will appear at the end (alphabetically).
workflow_order:
  - sdg_simple       # Synthetic data generation example
