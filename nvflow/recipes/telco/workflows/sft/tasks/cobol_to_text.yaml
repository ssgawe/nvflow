_base_: ../telco_sft_base.yaml

workflow:
  description: "COBOL-to-natural-language supervised fine-tuning workflow"

base_output_dir: /workspace/outputs/telco/workflow-sft-cobol/base

data:
  raw_train_file: nvflow/recipes/telco/datasets/telco_sft_train.jsonl
  raw_val_file: nvflow/recipes/telco/datasets/telco_sft_val.jsonl
  raw_test_file: nvflow/recipes/telco/datasets/telco_sft_test.jsonl
  prompt_config: nvflow/recipes/telco/prompts/cobol_to_text_template.yaml
  task_name: cobol_to_text
  source_keys:
    - cobol
    - problem
  target_keys:
    - description
    - generation
    - nl
  metadata_keys:
    - problem_id
    - submission_id

directories:
  step-0-prepare-sft-data: ${base_output_dir}/step-0-prepare-cobol-data

stages:
  prepare_sft_data:
    num_chunks: 1

  training:
    wandb_project: telco-cobol-training
