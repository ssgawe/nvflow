# ============================================================================
# GRPO Training Presets - NeMo-RL + NeMo-Gym (Full Preset)
# ============================================================================
# Model-independent default configurations for GRPO RL training.
# These presets are merged with model-specific overrides in workflow YAMLs.
#
# This is a FULL preset (like SFT) -- every parameter we pass is explicit.
# Model configs (e.g., qwen3_4b.yaml) override model-specific values.
#
# Aligned with NeMo-Gym example config:
#   RL/examples/nemo_gym/grpo_dapo17k_bytedtsinghua_qwen3_4binstruct_nf.yaml
# at NeMo-RL commit e95efb91 (the version in our nemo-skills container).
#
# Deviations from the NeMo-Gym example are marked with:
#   [FINANCE] -- intentional change for our open-QA / finance setup
#   [FIX]     -- upstream bug workaround
#   [MANAGED] -- key is set by nemo-skills at runtime; value here is
#                included in the config YAML but overridden by nemo-skills
#                via ++key=value CLI args (last-write-wins)
#
# The full preset is written as a YAML file and passed to
# run_grpo_nemo_gym.py via --config.  nemo-skills' runtime overrides
# (model_name, cluster, checkpoint_dir, etc.) are applied on top.
# ============================================================================

presets:
  grpo-base:
    # ========================================================================
    # GRPO Algorithm Configuration
    # ========================================================================
    grpo:
      max_num_epochs: 1
      num_prompts_per_step: 64
      num_generations_per_prompt: 16
      max_rollout_turns: 1
      max_num_steps: 1000000
      normalize_rewards: true
      use_leave_one_out_baseline: true
      val_period: 10
      val_at_start: true
      overlong_filtering: false
      max_val_samples: null            # Inferred from validation dataset size
      val_batch_size: null
      seed: 42
      use_dynamic_sampling: false
      dynamic_sampling_max_gen_batches: 10
      batch_multiplier: 1
      skip_reference_policy_logprobs_calculation: true

      reward_shaping:
        enabled: false
        overlong_buffer_length: 128
        overlong_buffer_penalty: 1
        max_response_length: 32768     # Should match policy.max_total_sequence_length

      reward_scaling:
        enabled: false
        source_min: 0.0
        source_max: 1.0
        target_min: 0.0
        target_max: 1.0

    # ========================================================================
    # Loss Function Configuration
    # ========================================================================
    loss_fn:
      reference_policy_kl_penalty: 0
      reference_policy_kl_type: "k3"
      kl_input_clamp_value: 20.0
      kl_output_clamp_value: 10.0
      ratio_clip_min: 0.2
      ratio_clip_max: 0.2
      ratio_clip_c: null
      use_on_policy_kl_approximation: false
      truncated_importance_sampling_ratio: null
      use_importance_sampling_correction: false
      token_level_loss: true
      force_on_policy_ratio: false

    # ========================================================================
    # Checkpointing Configuration
    # ========================================================================
    checkpointing:
      enabled: true
      # [MANAGED] checkpoint_dir and checkpoint_must_save_by are set by
      # nemo-skills grpo_nemo_rl() at runtime (output path and partition timeout).
      # Values here are overridden by nemo-skills at runtime via CLI args.
      checkpoint_dir: "results/grpo"
      checkpoint_must_save_by: null
      metric_name: "val:accuracy"
      higher_is_better: true
      keep_top_k: 3
      save_period: 1
      # [FIX] model_save_format must be null for DTensor v1 (_v2=false).
      # Set to "safetensors" only when using DTensor v2 or Megatron backend.
      model_save_format: null
      save_consolidated: false

    # ========================================================================
    # Policy Configuration (Model + Training + Generation)
    # ========================================================================
    policy:
      # [MANAGED] model_name is set by nemo-skills from hf_checkpoint_path.
      # Value here is overridden by nemo-skills at runtime via CLI args.
      model_name: null                 # e.g., "Qwen/Qwen3-4B"
      tokenizer:
        name: null                     # Set in model config (e.g. qwen3_4b.yaml)
        chat_template_kwargs: null
      hf_config_overrides: {}

      # Training batch sizes
      train_global_batch_size: 1024    # num_prompts_per_step * num_generations_per_prompt
      train_micro_batch_size: 1
      logprob_batch_size: 1
      generation_batch_size: 32
      max_total_sequence_length: 32768
      precision: "bfloat16"
      logprob_chunk_size: 1024
      max_grad_norm: 1.0
      # [FIX] NeMo-Gym example omits this but dtensor_policy_worker.py requires it
      offload_optimizer_for_logprob: false

      # DTensor (FSDP) configuration - default backend for GRPO
      dtensor_cfg:
        _v2: false
        # [MANAGED] enabled is set by nemo-skills based on backend parameter.
        enabled: true
        cpu_offload: false
        sequence_parallel: false
        activation_checkpointing: true
        tensor_parallel_size: 2
        context_parallel_size: 1
        custom_parallel_plan: null
        clear_cache_every_n_steps: null

      # Megatron configuration (disabled by default for GRPO)
      # Enable via backend: megatron in model config
      megatron_cfg:
        # [MANAGED] enabled is set by nemo-skills based on backend parameter.
        enabled: false
        empty_unused_memory_level: 0
        activation_checkpointing: true
        converter_type: "Qwen2ForCausalLM"
        tensor_model_parallel_size: 1
        expert_tensor_parallel_size: 1
        expert_model_parallel_size: 1
        pipeline_model_parallel_size: 1
        num_layers_in_first_pipeline_stage: null
        num_layers_in_last_pipeline_stage: null
        context_parallel_size: 1
        pipeline_dtype: "bfloat16"
        sequence_parallel: false
        freeze_moe_router: true
        moe_router_dtype: "fp64"
        moe_router_load_balancing_type: "none"
        moe_router_bias_update_rate: 0.0
        apply_rope_fusion: true
        defer_fp32_logits: true
        moe_permute_fusion: false
        bias_activation_fusion: true
        moe_per_layer_logging: false

        optimizer:
          optimizer: "adam"
          lr: 5.0e-6
          min_lr: 5.0e-7
          weight_decay: 0.01
          bf16: true
          fp16: false
          params_dtype: "float32"
          adam_beta1: 0.9
          adam_beta2: 0.999
          adam_eps: 1e-8
          sgd_momentum: 0.9
          use_distributed_optimizer: true
          use_precision_aware_optimizer: true
          optimizer_cpu_offload: false
          optimizer_offload_fraction: 0.0
          clip_grad: 1.0

        scheduler:
          start_weight_decay: 0.01
          end_weight_decay: 0.01
          weight_decay_incr_style: "constant"
          lr_decay_style: "constant"
          lr_decay_iters: null
          lr_warmup_iters: 13
          lr_warmup_init: 5.0e-7

        distributed_data_parallel_config:
          grad_reduce_in_fp32: false
          overlap_grad_reduce: true
          overlap_param_gather: true
          use_custom_fsdp: false
          data_parallel_sharding_strategy: "optim_grads_params"

        env_vars: null

      # Dynamic batching (disabled by default)
      dynamic_batching:
        enabled: false
        train_mb_tokens: 32768         # max_total_sequence_length * train_micro_batch_size
        logprob_mb_tokens: 32768       # max_total_sequence_length * logprob_batch_size
        sequence_length_round: 64

      # Sequence packing (disabled by default for GRPO)
      sequence_packing:
        enabled: false
        train_mb_tokens: 32768         # max_total_sequence_length * train_micro_batch_size
        logprob_mb_tokens: 32768       # max_total_sequence_length * logprob_batch_size
        algorithm: "modified_first_fit_decreasing"
        sequence_length_round: 64

      make_sequence_length_divisible_by: 2  # Matches dtensor TP=2

      # Optimizer (DTensor/FSDP backend)
      optimizer:
        name: "torch.optim.AdamW"
        kwargs:
          lr: 1.0e-6
          weight_decay: 0.01
          betas: [0.9, 0.999]
          eps: 1e-8
          foreach: false
          fused: false

      # Scheduler (DTensor/FSDP backend)
      scheduler:
        - name: "torch.optim.lr_scheduler.ConstantLR"
          kwargs:
            factor: 1.0
            total_iters: 10000000000
        - milestones: []

      # Generation configuration (vLLM inference server)
      generation:
        backend: "vllm"
        max_new_tokens: 32768
        temperature: 1.0
        top_p: 1.0
        top_k: null
        stop_token_ids: null
        stop_strings: null
        vllm_cfg:
          async_engine: true           # Required for NeMo-Gym (HTTP server)
          precision: "bfloat16"
          # [FIX] NeMo-Gym example omits kv_cache_dtype but grpo.py requires it
          kv_cache_dtype: "auto"
          tensor_parallel_size: 1
          pipeline_parallel_size: 1
          enable_expert_parallel: false
          expert_parallel_size: 1
          gpu_memory_utilization: 0.8
          max_model_len: 32768
          enforce_eager: false
          use_deep_gemm: false
          num_last_layers_in_bf16: 0
          num_first_layers_in_bf16: 0
          expose_http_server: true     # Required for NeMo-Gym
          skip_tokenizer_init: false
          http_server_serving_chat_kwargs:
            enable_auto_tools: true
            tool_parser: hermes
        vllm_kwargs:
          compilation_config:
            use_inductor: false
        colocated:
          enabled: true
          resources:
            gpus_per_node: null
            num_nodes: null

    # ========================================================================
    # Environment Configuration (NeMo-Gym)
    # ========================================================================
    # [FINANCE] NeMo-Gym example uses library_judge_math for math problems.
    # We use equivalence_llm_judge for open-QA semantic equivalence.
    # To change: override env.nemo_gym in your model config.
    #
    # Judge model routing:
    #   The training stage dynamically injects judge_model_server.name and
    #   the judge_model adapter config based on training.judge_vllm in the
    #   workflow YAML.  No hardcoded judge config is needed here.
    #   See: nvflow/recipes/finance/stages/rl/training.py (_inject_judge_config)
    env:
      should_use_nemo_gym: true
      should_log_nemo_gym_responses: true
      nemo_gym:
        config_paths:
          - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
          - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
          - /workspace/nvflow/recipes/finance/prompts/finance_openqa_judge_overlay.yaml

    # ========================================================================
    # Data Configuration
    # ========================================================================
    data:
      shuffle: true
      num_workers: 0

    # ========================================================================
    # Logger Configuration
    # ========================================================================
    # [FINANCE] NeMo-Gym example enables W&B with project "grpo-dev".
    # We disable W&B by default and use finance-specific project names.
    logger:
      # [MANAGED] log_dir is set by nemo-skills to the output directory.
      log_dir: "logs"
      num_val_samples_to_print: 5
      wandb_enabled: false
      swanlab_enabled: false
      tensorboard_enabled: false
      mlflow_enabled: false
      monitor_gpus: true
      wandb:
        project: "finance-grpo"
        name: "grpo-training"
      swanlab:
        project: "finance-grpo"
        name: "grpo-training"
      tensorboard: {}
      mlflow:
        experiment_name: "finance-grpo"
        run_name: "grpo-training"
      gpu_monitoring:
        collection_interval: 10
        flush_interval: 10

    # ========================================================================
    # Cluster Configuration (overridden by nemo-skills)
    # ========================================================================
    # [MANAGED] cluster.gpus_per_node and cluster.num_nodes are set by
    # nemo-skills from num_gpus and num_nodes parameters.
    # Values here are overridden by nemo-skills at runtime via CLI args.
    cluster:
      gpus_per_node: 8
      num_nodes: 1
