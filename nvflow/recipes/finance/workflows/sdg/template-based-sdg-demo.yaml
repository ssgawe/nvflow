# ============================================================================
# Finance SDG Pipeline - Demo Configuration
# ============================================================================
# Quick E2E demo configuration for testing the full pipeline.
# Uses smaller models, fewer resources, and runs stages sequentially.
#
# Usage:
#   uv run nflow run-all --config workflows/sdg/template-based-sdg-demo.yaml
# ============================================================================

# Inherit production config (includes directories and dependencies)
_base_: template-based-sdg.yaml

# Demo output directory (alongside demo filings)
base_output_dir: /workspace/outputs/finance/demo/workflow-3-template-based-sdg

# Use demo filings (from download_sec_filings demo stage)
filings_dir: /workspace/outputs/finance/demo/workflow-2-download-sec/step-0-download

# ============================================================================
# Demo Stage Overrides - Only override what's different from prod
# ============================================================================
stages:

  # --------------------------------------------------------------------------
  # Stage 0: Create Seed Data - Filter to 7 companies and 30 questions for demo
  # --------------------------------------------------------------------------
  create_seed_data:
    output_file: ${directories.step-0-create-seed-data}/seed_questions_demo.jsonl
    company_info_file: ${directories.step-0-create-seed-data}/company_info_demo.tsv
    filter_company_list: "GOOG,AAPL,CSCO,IBM,META,NVDA,MSFT"
    num_seed_questions: 30
    dependencies: []

  # --------------------------------------------------------------------------
  # Stage 1: Generate Questions - Smaller model, fewer GPUs
  # --------------------------------------------------------------------------
  generate_questions:
    input_file: ${directories.step-0-create-seed-data}/seed_questions_demo.jsonl
    company_info_file: ${directories.step-0-create-seed-data}/company_info_demo.tsv
    start_year: 2020
    end_year: 2024
    inline_args: "++inference.tokens_to_generate=4096 ++chat_template_kwargs.enable_thinking=false"
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-4B-Instruct-2507
      server_type: vllm
      server_gpus: 1
      server_nodes: 1
      server_args: "--max-model-len 16384"


  # --------------------------------------------------------------------------
  # Stage 2: Map Questions to Context - Lower token limit
  # --------------------------------------------------------------------------
  map_questions_to_context:
    token_limit: 10000

  # --------------------------------------------------------------------------
  # Stage 3: Generate Answers - Smaller model, fewer seeds
  # --------------------------------------------------------------------------
  generate_answers:
    inline_args: "++inference.tokens_to_generate=4096 ++chat_template_kwargs.enable_thinking=false"
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-4B-Instruct-2507
      server_type: vllm
      server_gpus: 1
      server_nodes: 1
      num_chunks: 2
      num_random_seeds: 3
      server_args: "--max-model-len 16384"


  # --------------------------------------------------------------------------
  # Stage 4: GenSelect Answers - Smaller model
  # --------------------------------------------------------------------------
  genselect_answers:
    inline_args: "++inference.tokens_to_generate=4096 ++chat_template_kwargs.enable_thinking=false"
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-4B-Instruct-2507
      server_type: vllm
      server_gpus: 1
      server_nodes: 1
      num_chunks: 4
      server_args: "--max-model-len 16384"


  # --------------------------------------------------------------------------
  # Stage 5: Filter Answers - Smaller model
  # --------------------------------------------------------------------------
  filter_answers:
    inline_args: "++generation_key=filter_generation ++inference.tokens_to_generate=2048 ++chat_template_kwargs.enable_thinking=false"
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-4B-Instruct-2507
      server_type: vllm
      server_gpus: 1
      server_nodes: 1
      num_chunks: 4
      server_args: "--max-model-len 8192"
