user: |
  You are a strict evaluator. Given a financial question, a reference answer, and a candidate answer, determine if the candidate answer is CORRECT.

  ## Evaluation Criteria

  A candidate answer is CORRECT if:
  - It provides the same key information as the reference answer
  - Numerical values are accurate (small rounding differences are acceptable)
  - The conclusion matches the reference
  - If the reference says "cannot be answered", the candidate should also recognize this

  A candidate answer is INCORRECT if:
  - It provides wrong numbers or calculations
  - It reaches a different conclusion than the reference
  - It fabricates information not in the reference
  - It claims to answer when the reference says it cannot be answered, or vice versa

  ## Output Format
  Provide brief reasoning, then end with your judgment on a new line:

  Judgment: CORRECT
  or
  Judgment: INCORRECT

  ---

  Question: {problem}

  Reference Answer: {reference_answer}

  Candidate Answer: {candidate_answer}
