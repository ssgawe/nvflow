# ============================================================================
# Financial Q&A SFT Prompt Template
# ============================================================================
# Purpose: Transform financial documents and questions into training format
#          for supervised fine-tuning (SFT)
#
# Task: Answer questions about financial documents (10-K, 10-Q filings)
#       based solely on provided context
#
# Source: Adapted from the SECQUE benchmark paper
#         "SECQUE: A Benchmark for Evaluating Real-World Financial Analysis
#         Capabilities" (Ben Yoash et al., 2024)
#         https://arxiv.org/pdf/2504.04596
#
# Input Variables:
#   - document: Financial text extracted from 10-K or 10-Q files
#   - problem: Question written by domain experts
#
# Output: Concise and accurate answer based only on the provided document
#
# Usage: Reference this prompt in your workflow config:
#   ++prompt_config=nvflow/recipes/finance/prompts/financial_qa_sft
# ============================================================================

# User message - Combined instructions and template with input variable placeholders
user: |
  You are given a financial text extracted from 10-K or 10-Q files and a question written by domain experts. Your task is to answer the question based only on the provided context. Do not use any additional context. Your answer should be concise and accurate. In case you are unable to answer the question, you should state that you can't answer the question. Do not guess and do not suggest your own solutions.

  Input:
  • Document: {context}
  • Question: {problem}

  Output:
  • Think through the problem step by step if needed
  • Conclude with your final answer prefixed by "Answer:"

  Example format:
  [Your reasoning here]
  Answer: [Your concise answer]
