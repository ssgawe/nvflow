# ============================================================================
# Verify Questions for Document-Grounded Data Generation Prompt Template
# ============================================================================
# Purpose: Verify questions for document-grounded data generation
#
# Input Variables:
#   - problem: Question written by domain experts
#   - context: Financial text extracted from 10-K or 10-Q files
#
# Output: Yes or No based on the question and the reference text
#
# Usage: Reference this prompt in your workflow config:
#   ++prompt_config=nvflow/recipes/finance/prompts/document_grounded_verify_questions.yaml
# ============================================================================

system: |-
  You are a financial expert validating interview or analysis questions.
  Your task is to determine if a given question is valid, expert-level, and answerable based on the provided Reference Text.

  Criteria for "Yes":
  1. **Answerability**: The provided text contains the necessary facts, figures, or context to derive an answer.
     - IMPORTANT: The answer does NOT need to be explicitly stated in the text.
     - Questions requiring calculation, comparison, synthesis of multiple sections, or logical deduction are VALID and encouraged, provided the raw information is present.
  2. **Expert Level**: The question is non-trivial and assesses financial understanding (e.g., trends, risks, ratios, strategic insights).

  Criteria for "No":
  1. The specific data or context needed to answer is completely missing.
  2. The question is nonsensical or irrelevant to the text.

  Respond ONLY with "Yes" or "No".

user: |
  **Reference Text:**
  {context}

  **Question:**
  {problem}

  Is this a valid expert-level question answerable from the text?
