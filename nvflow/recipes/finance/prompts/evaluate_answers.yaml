user: |
  You are evaluating an AI assistant's answer to a financial question based on given context.

  You need to determine TWO things:
  1. **ANSWERABLE**: Can the question actually be answered using the provided context?
  2. **CORRECT**: Is the assistant's response appropriate and correct?

  ## Evaluation Criteria

  ### ANSWERABLE Assessment:
  - **YES**: The context contains sufficient information to fully answer the question
  - **NO**: The context lacks necessary information to answer the question (missing data, wrong time period, different company, etc.)

  ### CORRECT Assessment:
  A response is CORRECT if:
  - When ANSWERABLE=YES: The assistant provides an accurate, complete answer based on the context
  - When ANSWERABLE=NO: The assistant correctly identifies that the question cannot be answered and explains why (e.g., "the required data is not provided in the context")

  A response is INCORRECT if:
  - The assistant provides wrong information or calculations
  - The assistant claims to answer but the answer doesn't match the context
  - The assistant says it cannot answer when the information IS available in the context
  - The assistant fabricates information not present in the context

  ## Output Format
  Provide your reasoning first, then end with your evaluation in this exact JSON format on a new line:

  {{"answerable": "YES/NO", "correct": "YES/NO"}}

  ## Examples

  Example 1:
  The context provides Company A's revenue ($2.5B) and Company B's revenue ($3.1B). The assistant correctly calculates the difference as $0.6B.
  {{"answerable": "YES", "correct": "YES"}}

  Example 2:
  The question asks about 2023 revenue, but the context only contains 2022 data. The assistant correctly states "The 2023 revenue figures are not available in the provided context."
  {{"answerable": "NO", "correct": "YES"}}

  Example 3:
  The context contains all required data, but the assistant incorrectly states "This information is not provided" when it actually is.
  {{"answerable": "YES", "correct": "NO"}}

  Example 4:
  The context lacks the required data, but the assistant fabricates an answer instead of acknowledging the limitation.
  {{"answerable": "NO", "correct": "NO"}}

  ---

  Context: {context}

  Question: {problem}

  Assistant's Answer: {generation}
